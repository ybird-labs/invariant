name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      flake-check: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.flake-check == 'true' }}
      rust-quality: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust-quality == 'true' }}
      change-risk: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.change-risk == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect files that affect CI gates
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        with:
          filters: |
            flake-check:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/nix.yml'
              - 'crates/**'
            rust-quality:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/nix.yml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
              - 'scripts/ci/rust-quality.sh'
              - 'crates/**'
              - 'src/**'
            change-risk:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/nix.yml'
              - '.cargo/**'
              - 'scripts/ci/**'
              - 'crates/**'
              - 'src/**'

  flake-check:
    name: flake-check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.flake-check == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 4G

      - name: Run flake checks
        run: nix develop --accept-flake-config -c just _flake-check

  rust-quality:
    name: rust-quality (ubuntu)
    needs: changes
    if: needs.changes.outputs.rust-quality == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: quality
          cmd-format: nix develop --accept-flake-config -c {0}
          cache-bin: false

      - name: Run fmt, clippy, and tests
        run: nix develop --accept-flake-config -c just _rust-quality

  change-risk:
    name: change-risk (cargo-crap)
    needs: changes
    if: needs.changes.outputs.change-risk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: llvm-cov
          cmd-format: nix develop --accept-flake-config -c {0}
          cache-bin: false

      - name: Check change risk
        run: nix develop --accept-flake-config -c just _change-risk
