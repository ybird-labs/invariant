name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      flake-check: ${{ steps.filter.outputs.flake-check }}
      rust-quality: ${{ steps.filter.outputs.rust-quality }}
      change-risk: ${{ steps.filter.outputs.change-risk }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect files that affect CI gates
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "flake-check=true" >> "$GITHUB_OUTPUT"
            echo "rust-quality=true" >> "$GITHUB_OUTPUT"
            echo "change-risk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi

          echo "Comparing $base...$HEAD_SHA"
          changed_files="$(git diff --name-only "$base" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          flake_check=false
          rust_quality=false
          change_risk=false

          while IFS= read -r file; do
            case "$file" in
              Cargo.toml|Cargo.lock|\
              Justfile|\
              flake.nix|flake.lock|\
              crates/*|crates/**/*)
                flake_check=true
                rust_quality=true
                change_risk=true
                ;;
            esac

            case "$file" in
              .cargo/*|.cargo/**/*|\
              .config/*|.config/**/*|\
              rustfmt.toml|.rustfmt.toml|\
              clippy.toml|.clippy.toml|\
              scripts/ci/rust-quality.sh|\
              src/*|src/**/*)
                rust_quality=true
                ;;
            esac

            case "$file" in
              .cargo/*|.cargo/**/*|\
              scripts/ci/*|scripts/ci/**/*|\
              src/*|src/**/*)
                change_risk=true
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          echo "flake-check=$flake_check" >> "$GITHUB_OUTPUT"
          echo "rust-quality=$rust_quality" >> "$GITHUB_OUTPUT"
          echo "change-risk=$change_risk" >> "$GITHUB_OUTPUT"

  flake-check:
    name: flake-check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.flake-check == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea

      - name: Enable Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39

      - name: Run flake checks
        run: nix develop --accept-flake-config -c just _flake-check

  rust-quality:
    name: rust-quality (ubuntu)
    needs: changes
    if: needs.changes.outputs.rust-quality == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea

      - name: Enable Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39

      - name: Run fmt, clippy, and tests
        run: nix develop --accept-flake-config -c just _rust-quality

  change-risk:
    name: change-risk (cargo-crap)
    needs: changes
    if: needs.changes.outputs.change-risk == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea

      - name: Enable Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39

      - name: Check change risk
        run: nix develop --accept-flake-config -c just _change-risk
